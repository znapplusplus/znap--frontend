<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 400" fill="none">
  <!-- Shadow -->
  <ellipse cx="190" cy="375" rx="90" ry="13" fill="#00000018"/>

  <!-- Body -->
  <ellipse cx="190" cy="255" rx="92" ry="98" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Left arm holding phone -->
  <rect x="60" y="240" width="58" height="80" rx="10" fill="#1E3A5F" stroke="#152840" stroke-width="1.5"/>
  <rect x="64" y="246" width="50" height="62" rx="7" fill="#2A4F7A"/>
  <!-- Phone screen -->
  <rect x="67" y="249" width="44" height="56" rx="5" fill="#3B8BEB" opacity="0.9"/>
  <!-- Phone camera icon on screen -->
  <circle cx="89" cy="277" r="12" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="89" cy="277" r="7" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="89" cy="277" r="4" fill="#FFFFFF" opacity="0.8"/>
  <!-- Left arm holding phone (wrist) -->
  <rect x="70" y="315" width="38" height="16" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Right arm holding ID card -->
  <rect x="262" y="225" width="76" height="56" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <!-- ID card content -->
  <rect x="268" y="231" width="24" height="24" rx="4" fill="#3B8BEB" opacity="0.3"/>
  <circle cx="280" cy="243" r="8" fill="#3B8BEB" opacity="0.5"/>
  <rect x="298" y="233" width="34" height="5" rx="2" fill="#CBD5E1"/>
  <rect x="298" y="242" width="26" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="298" y="249" width="30" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="268" y="260" width="64" height="3" rx="1.5" fill="#E2E8F0"/>
  <rect x="268" y="266" width="50" height="3" rx="1.5" fill="#E2E8F0"/>
  <!-- Right arm (wrist) -->
  <rect x="270" y="275" width="38" height="16" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Camera strap across body -->
  <path d="M108 268 Q130 242 160 238" stroke="#255AB1" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Small camera on strap -->
  <rect x="150" y="270" width="42" height="32" rx="6" fill="#1E3A5F"/>
  <circle cx="171" cy="286" r="11" fill="#0F1E30"/>
  <circle cx="171" cy="286" r="7" fill="#1a2e45"/>
  <circle cx="171" cy="286" r="4" fill="#0a1520"/>
  <circle cx="168" cy="283" r="2" fill="#FFFFFF" opacity="0.3"/>

  <!-- Neck -->
  <rect x="172" y="218" width="36" height="20" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Head -->
  <ellipse cx="190" cy="190" rx="72" ry="66" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Cap brim -->
  <ellipse cx="190" cy="136" rx="76" ry="12" fill="#255AB1"/>
  <!-- Cap top -->
  <ellipse cx="190" cy="113" rx="62" ry="36" fill="#255AB1"/>
  <!-- Cap highlight -->
  <ellipse cx="174" cy="104" rx="15" ry="9" fill="#3B72CC" opacity="0.5"/>
  <!-- Cap Z letter -->
  <text x="177" y="128" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="white" letter-spacing="-1">Z</text>

  <!-- Left eye white -->
  <circle cx="163" cy="183" r="19" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Right eye white -->
  <circle cx="217" cy="183" r="19" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Left eye iris -->
  <circle cx="165" cy="185" r="12" fill="#1a1a2e"/>
  <!-- Right eye iris -->
  <circle cx="219" cy="185" r="12" fill="#1a1a2e"/>
  <!-- Left eye shine -->
  <circle cx="160" cy="180" r="4.5" fill="white"/>
  <!-- Right eye shine -->
  <circle cx="214" cy="180" r="4.5" fill="white"/>
  <!-- Surprised/excited small eye shine -->
  <circle cx="169" cy="188" r="2" fill="white" opacity="0.6"/>
  <circle cx="223" cy="188" r="2" fill="white" opacity="0.6"/>

  <!-- Beak/Mouth - surprised O shape -->
  <ellipse cx="190" cy="213" rx="12" ry="9" fill="#F29900"/>
  <ellipse cx="190" cy="210" rx="12" ry="7" fill="#FFB340"/>
  <!-- Mouth open hint -->
  <ellipse cx="190" cy="214" rx="7" ry="5" fill="#FF8C00" opacity="0.6"/>

  <!-- Cheek blush -->
  <ellipse cx="146" cy="200" rx="10" ry="6" fill="#FFB3B3" opacity="0.45"/>
  <ellipse cx="234" cy="200" rx="10" ry="6" fill="#FFB3B3" opacity="0.45"/>

  <!-- Feet -->
  <ellipse cx="165" cy="357" rx="24" ry="9" fill="#255AB1" transform="rotate(-10 165 357)"/>
  <ellipse cx="212" cy="359" rx="24" ry="9" fill="#255AB1" transform="rotate(10 212 359)"/>
  <rect x="153" y="343" width="20" height="18" rx="4" fill="#3A6BC7"/>
  <rect x="200" y="343" width="20" height="18" rx="4" fill="#3A6BC7"/>

  <!-- Sparkles for "trust" feel -->
  <path d="M50 140 l3-8 3 8-8-3 8-3z" fill="#F29900" opacity="0.7"/>
  <path d="M330 170 l2.5-6.5 2.5 6.5-6.5-2.5 6.5-2.5z" fill="#255AB1" opacity="0.6"/>
  <path d="M40 290 l2-5 2 5-5-2 5-2z" fill="#F29900" opacity="0.5"/>
</svg>
